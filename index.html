<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>StorImage | معالجة وتحميل الصور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        brand: {
                            primary: '#2563eb',
                            success: '#10b981',
                            dark: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; transition: background-color 0.3s ease; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .light .glass { background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(0, 0, 0, 0.05); }
        
        .view-section { display: none; opacity: 0; transform: translateY(10px); }
        .view-section.active { display: block; opacity: 1; transform: translateY(0); transition: all 0.4s ease; }

        .drop-zone { border: 2px dashed #3b82f6; transition: all 0.3s ease; }
        .drop-zone.active { background: rgba(59, 130, 246, 0.1); border-style: solid; }

        #modal-auth { display: none; }
        #modal-auth.open { display: flex; }

        /* حاوية الإعلانات السفلية */
        .ads-footer-container {
            margin-top: 60px;
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.2);
            width: 100%;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">

    <!-- Header -->
    <nav class="fixed top-0 left-0 right-0 z-50 glass border-b dark:border-white/5 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.switchView('upload')">
                <div class="w-10 h-10 bg-brand-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                    <i data-lucide="image" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-black italic">Stor<span class="text-brand-primary">Image</span></h1>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="window.switchView('stats')" class="text-sm font-bold hover:text-brand-primary transition-colors hidden md:block">الإحصائيات</button>
                <button onclick="window.toggleTheme()" class="p-2.5 rounded-xl bg-slate-200 dark:bg-white/5 text-slate-600 dark:text-slate-400">
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                </button>
                <button onclick="window.openAuth()" class="p-2.5 rounded-xl bg-slate-200 dark:bg-white/5 text-slate-600 dark:text-slate-400">
                    <i data-lucide="shield-check" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 pt-28">
        <!-- View: Upload -->
        <section id="view-upload" class="view-section active space-y-8">
            <div class="text-center space-y-4">
                <h2 class="text-4xl font-black">حوّل صورك <span class="text-brand-primary">بذكاء</span></h2>
                <p class="text-slate-500 font-bold">أداة احترافية لتحويل وضغط الصور مجاناً وبأعلى دقة.</p>
            </div>

            <!-- Image Settings -->
            <div class="glass p-6 rounded-[2rem] flex flex-wrap items-center justify-between gap-6">
                <div class="flex flex-wrap items-center gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase text-slate-400">الصيغة المطلوبة</label>
                        <select id="export-format" class="block bg-slate-100 dark:bg-slate-800 p-3 rounded-xl outline-none font-bold">
                            <option value="webp">WebP</option>
                            <option value="png">PNG</option>
                            <option value="jpg">JPG</option>
                        </select>
                    </div>
                    <div class="space-y-2 min-w-[200px]">
                        <label class="text-[10px] font-black uppercase text-slate-400 flex justify-between">نسبة الضغط <span id="quality-val" class="text-brand-primary">85%</span></label>
                        <input type="range" id="quality-slider" min="10" max="100" value="85" class="w-full accent-brand-primary">
                    </div>
                </div>
                <button onclick="window.clearQueue()" class="text-red-500 font-black text-sm px-6 py-3 rounded-xl hover:bg-red-500/10 transition-all">مسح الصور</button>
            </div>

            <!-- Drag & Drop -->
            <div id="drop-area" class="drop-zone glass rounded-[3rem] p-16 text-center cursor-pointer relative">
                <input type="file" id="file-input" multiple accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10">
                <div class="space-y-4">
                    <div class="w-20 h-20 bg-brand-primary/10 text-brand-primary rounded-full flex items-center justify-center mx-auto">
                        <i data-lucide="upload-cloud" class="w-10 h-10"></i>
                    </div>
                    <h3 class="text-2xl font-black">اسحب وأفلت الصور هنا</h3>
                    <p class="text-slate-500 font-bold">أو انقر لاختيار ملفات من جهازك</p>
                </div>
            </div>

            <!-- File List -->
            <div id="file-queue" class="space-y-4"></div>

            <!-- Actions -->
            <div id="action-bar" class="hidden text-center py-10">
                <div class="flex flex-wrap justify-center gap-4">
                    <button onclick="window.processAll()" id="btn-process-all" class="bg-brand-primary text-white px-12 py-5 rounded-2xl font-black shadow-xl hover:scale-105 transition-all">معالجة الصور الآن</button>
                    <button onclick="window.downloadAll()" id="btn-download-all" class="hidden bg-brand-success text-white px-12 py-5 rounded-2xl font-black shadow-xl hover:scale-105 transition-all">تحميل كافة الصور</button>
                </div>
            </div>
        </section>

        <!-- View: Stats -->
        <section id="view-stats" class="view-section space-y-10">
            <h2 class="text-3xl font-black text-center">إحصائياتك الشخصية</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass p-10 rounded-[2.5rem] text-center space-y-4 border-b-4 border-brand-primary">
                    <p class="text-slate-500 font-black text-xs uppercase tracking-tighter">إجمالي المعالجات</p>
                    <p id="stat-total" class="text-6xl font-black tracking-tighter">0</p>
                </div>
                <div class="glass p-10 rounded-[2.5rem] text-center space-y-4 border-b-4 border-brand-success">
                    <p class="text-slate-500 font-black text-xs uppercase tracking-tighter">المساحة الموفرة</p>
                    <p id="stat-saved" class="text-6xl font-black text-brand-success tracking-tighter">0 <span class="text-xl font-bold">KB</span></p>
                </div>
            </div>
            <div class="text-center">
                <button onclick="window.switchView('upload')" class="bg-slate-200 dark:bg-white/5 px-8 py-3 rounded-xl font-bold">العودة للتحويل</button>
            </div>
        </section>
    </main>

    <!-- Adsterra Ads Container (Bottom Only) -->
    <footer class="ads-footer-container">
        <div class="max-w-4xl mx-auto">
            <p class="text-[10px] text-slate-500 font-black mb-4 uppercase tracking-[0.4em]">مساحة إعلانية مدعومة</p>
            <div id="ads-injection-container" class="min-h-[120px] flex items-center justify-center overflow-hidden">
                <!-- Adsterra Script Fixed in Footer -->
                <script type="text/javascript">
                    atOptions = {
                        'key' : '15385b7c751e6c7d59d59fb7f34e2934',
                        'format' : 'iframe',
                        'height' : 90,
                        'width' : 728,
                        'params' : {}
                    };
                </script>
                <script type="text/javascript" src="//www.highperformanceformat.com/15385b7c751e6c7d59d59fb7f34e2934/invoke.js"></script>
            </div>
            <p class="mt-8 text-[10px] text-slate-600 font-medium">© 2024 StorImage - جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <!-- Auth Modal (Settings) -->
    <div id="modal-auth" class="fixed inset-0 z-[100] bg-black/80 backdrop-blur-xl items-center justify-center p-6">
        <div class="glass p-8 md:p-12 rounded-[3rem] w-full max-w-xl space-y-8 border border-white/10">
            <div class="flex justify-between items-center">
                <h3 class="text-2xl font-black">إعدادات الإعلانات</h3>
                <button onclick="window.closeAuth()" class="p-2 hover:bg-white/5 rounded-full"><i data-lucide="x"></i></button>
            </div>
            <div class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 px-1">كود Adsterra / الإعلانات السفلية</label>
                    <textarea id="ad-scripts" placeholder="الصق كود السكربت هنا..." class="w-full bg-black/40 p-5 rounded-2xl outline-none h-48 font-mono text-xs border border-white/5 focus:border-brand-primary text-slate-300"></textarea>
                </div>
                <button onclick="window.saveAdminSettings()" class="w-full bg-brand-primary text-white py-4 rounded-2xl font-black shadow-lg hover:brightness-110 transition-all">تحديث الكود</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] transform translate-y-32 opacity-0 transition-all duration-500">
        <div class="bg-brand-primary text-white px-10 py-4 rounded-2xl shadow-2xl font-black flex items-center gap-3">
            <i data-lucide="bell"></i>
            <span id="toast-msg">تمت العملية</span>
        </div>
    </div>

    <script type="module" src="index.tsx"></script>
</body>
</html>
