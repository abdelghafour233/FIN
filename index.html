<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>StorImage Studio | معالجة وضغط الصور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: { 
                        brand: { 
                            primary: '#3b82f6', 
                            accent: '#8b5cf6',
                            success: '#10b981',
                            dark: '#020617',
                            card: '#0f172a'
                        } 
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; transition: background 0.3s ease; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .gradient-text { background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .upload-zone { border: 2px dashed rgba(255,255,255,0.1); transition: all 0.3s ease; }
        .upload-zone:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-white dark:bg-brand-dark text-slate-900 dark:text-slate-100 min-h-screen">

    <nav class="fixed top-0 left-0 right-0 z-50 glass px-6 py-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
                <div class="w-10 h-10 bg-brand-primary rounded-xl flex items-center justify-center text-white shadow-xl">
                    <i data-lucide="aperture" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-black">Stor<span class="gradient-text">Image</span></h1>
            </div>
            <button onclick="window.toggleTheme()" class="w-10 h-10 bg-slate-200 dark:bg-white/5 rounded-xl flex items-center justify-center">
                <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 pt-32 pb-24">
        <header class="text-center mb-12">
            <h2 class="text-4xl font-black mb-4">استوديو <span class="gradient-text">الصور</span> الذكي</h2>
            <p class="text-slate-500 font-bold">ارفع صورك، اضغطها، وغير صيغتها بضغطة زر واحدة.</p>
        </header>

        <!-- Drop Zone -->
        <div id="drop-zone" onclick="document.getElementById('file-input').click()" class="upload-zone p-12 rounded-[2.5rem] text-center cursor-pointer mb-10 group active:scale-[0.98]">
            <input type="file" id="file-input" multiple class="hidden" accept="image/*">
            <div class="w-20 h-20 bg-brand-primary/10 text-brand-primary rounded-3xl flex items-center justify-center mx-auto mb-6 group-hover:scale-110 transition-transform">
                <i data-lucide="upload-cloud" class="w-10 h-10"></i>
            </div>
            <h3 class="text-2xl font-black mb-2">اضغط هنا أو اسحب الصور</h3>
            <p class="text-sm opacity-50">JPG, PNG, WebP, GIF - حتى 20 ميجابايت للصور</p>
        </div>

        <!-- Controls (Visible when files are added) -->
        <div id="controls-panel" class="hidden bg-brand-card/50 p-8 rounded-[2rem] border border-white/5 mb-8 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="text-xs font-bold opacity-50 block mb-3 text-right">جودة الضغط: <span id="quality-val" class="text-brand-primary">85%</span></label>
                    <input type="range" id="quality-slider" min="10" max="100" value="85" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-brand-primary">
                </div>
                <div>
                    <label class="text-xs font-bold opacity-50 block mb-3 text-right">تحويل إلى صيغة</label>
                    <select id="format-select" class="w-full bg-brand-dark p-3 rounded-xl border border-white/10 outline-none text-sm focus:border-brand-primary transition-colors text-right">
                        <option value="image/webp">WebP (أفضل ضغط)</option>
                        <option value="image/jpeg">JPEG (صيغة قياسية)</option>
                        <option value="image/png">PNG (بدون فقدان جودة)</option>
                    </select>
                </div>
            </div>
            <button id="process-all-btn" class="w-full bg-brand-primary hover:bg-brand-primary/90 text-white py-4 rounded-xl font-black shadow-lg transition-all active:scale-95">بدء معالجة الكل</button>
        </div>

        <!-- Queue -->
        <div id="files-list" class="space-y-4">
            <!-- Dynamic Files -->
        </div>

    </main>

    <footer class="text-center py-10 opacity-30 text-xs font-bold">
        &copy; 2024 StorImage Studio - نسخة معالجة الصور الاحترافية
    </footer>

    <script type="module" src="index.tsx"></script>
</body>
</html>
