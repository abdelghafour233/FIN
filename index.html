<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إيميج برو | معالجة وتحميل الصور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        brand: {
                            black: '#0a0a0a',
                            dark: '#121212',
                            green: '#10b981',
                            neon: '#00ff66',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; transition: all 0.4s ease; overflow-x: hidden; }
        .dark body { background-color: #0a0a0a; color: #fff; }
        .light body { background-color: #f8fafc; color: #0f172a; }
        
        .neon-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .dark .neon-card { background: #121212; border: 1px solid rgba(16, 185, 129, 0.1); }
        .light .neon-card { background: #fff; border: 1px solid #e2e8f0; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

        .view-content { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; }
        .view-content.active { display: block; opacity: 1; transform: translateY(0); }
        
        .drop-zone { border: 2px dashed rgba(16, 185, 129, 0.2); transition: all 0.3s; }
        .drop-zone.active { border-color: #10b981; background: rgba(16, 185, 129, 0.05); }
        
        .nav-link.active { color: #10b981; background: rgba(16, 185, 129, 0.1); border-radius: 1rem; }
        
        .image-ready::after { content: ''; position: absolute; inset: -3px; border: 2px solid #10b981; border-radius: 1.5rem; animation: pulse 2s infinite; pointer-events: none; }
        @keyframes pulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.2; } }

        #auth-overlay { display: none; opacity: 0; transition: all 0.3s ease; }
        #auth-overlay.active { display: flex; opacity: 1; }

        .share-btn { width: 50px; height: 50px; border-radius: 1rem; display: flex; align-items: center; justify-content: center; color: white; transition: all 0.2s; }
        .share-btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
    </style>
</head>
<body class="min-h-screen">

    <nav class="fixed top-0 left-0 right-0 z-50 bg-white/80 dark:bg-brand-black/80 backdrop-blur-md border-b dark:border-white/5 py-4 px-6">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.switchView('upload')">
                <div class="w-10 h-10 bg-brand-green rounded-xl flex items-center justify-center text-black shadow-lg">
                    <i data-lucide="zap" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-black">إيميج<span class="text-brand-green">برو</span></h1>
            </div>
            
            <div class="hidden md:flex items-center gap-2 p-1 bg-slate-100 dark:bg-white/5 rounded-2xl">
                <button onclick="window.switchView('upload')" id="nav-upload" class="nav-link active px-6 py-2 font-bold text-sm">الرئيسية</button>
                <button onclick="window.switchView('stats')" id="nav-stats" class="nav-link px-6 py-2 font-bold text-sm">الإحصائيات</button>
                <button onclick="window.switchView('settings')" id="nav-settings" class="nav-link px-6 py-2 font-bold text-sm">الإعدادات</button>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="window.toggleTheme()" class="w-11 h-11 border rounded-xl flex items-center justify-center text-brand-green">
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 pt-32 pb-20">
        
        <section id="view-upload" class="view-content active space-y-8">
            <div class="text-center space-y-2">
                <h2 class="text-3xl md:text-5xl font-black">أداة معالجة <span class="text-brand-green italic">الصور</span></h2>
                <p class="text-slate-500 font-bold">بسيطة، سريعة، وفعالة على كافة الأجهزة.</p>
            </div>

            <div class="neon-card p-6 rounded-[2.5rem] flex flex-wrap items-center justify-between gap-6">
                <div class="flex flex-wrap items-center gap-6">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-500 uppercase">الصيغة</label>
                        <select id="export-format" class="block bg-slate-100 dark:bg-white/5 rounded-xl px-4 py-2 outline-none font-bold">
                            <option value="webp">WebP</option>
                            <option value="png">PNG</option>
                            <option value="jpg">JPG</option>
                        </select>
                    </div>
                    <div class="space-y-1 min-w-[150px]">
                        <label class="text-[10px] font-black text-slate-500 uppercase flex justify-between">الجودة <span id="quality-val" class="text-brand-green">85%</span></label>
                        <input type="range" id="quality-slider" min="10" max="100" value="85" class="w-full accent-brand-green">
                    </div>
                </div>
                <button onclick="window.clearQueue()" class="text-red-500 font-black text-sm flex items-center gap-2">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> مسح الكل
                </button>
            </div>

            <div id="drop-area" class="drop-zone neon-card rounded-[3rem] p-16 text-center relative">
                <input type="file" id="file-input" multiple accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
                <div class="space-y-4">
                    <div class="w-20 h-20 bg-brand-green/10 text-brand-green rounded-full flex items-center justify-center mx-auto">
                        <i data-lucide="image-plus" class="w-10 h-10"></i>
                    </div>
                    <h3 class="text-xl font-black">اضغط هنا لرفع الصور</h3>
                </div>
            </div>

            <div id="file-queue" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

            <div id="action-bar" class="hidden space-y-10 py-10">
                <div class="flex flex-wrap justify-center gap-4">
                    <button onclick="window.processAll()" id="btn-process-all" class="bg-brand-green text-black px-12 py-5 rounded-2xl font-black shadow-xl shadow-brand-green/20">بدء المعالجة</button>
                    <button onclick="window.downloadAll()" id="btn-download-all" class="hidden border-2 border-brand-green text-brand-green px-12 py-5 rounded-2xl font-black">تحميل الكل</button>
                </div>

                <div id="share-section" class="hidden flex flex-col items-center gap-6 p-8 rounded-[2.5rem] bg-slate-100 dark:bg-white/5 border dark:border-white/5">
                    <span class="text-xs font-black text-slate-500 uppercase">شارك الأداة مع أصدقائك</span>
                    <div class="flex gap-4">
                        <button onclick="window.shareTo('wa')" class="share-btn bg-[#25D366]"><i data-lucide="message-circle"></i></button>
                        <button onclick="window.shareTo('fb')" class="share-btn bg-[#1877F2]"><i data-lucide="facebook"></i></button>
                        <button onclick="window.shareTo('tg')" class="share-btn bg-[#0088cc]"><i data-lucide="send"></i></button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Stats View -->
        <section id="view-stats" class="view-content space-y-10">
            <h2 class="text-3xl font-black text-center">الإحصائيات العامة</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="neon-card p-10 rounded-[2.5rem] text-center space-y-2">
                    <p class="text-slate-500 font-bold">الصور المعالجة</p>
                    <p class="text-5xl font-black" id="stat-total">0</p>
                </div>
                <div class="neon-card p-10 rounded-[2.5rem] text-center space-y-2">
                    <p class="text-slate-500 font-bold">المساحة الموفرة</p>
                    <p class="text-5xl font-black" id="stat-saved">0 <span class="text-xl">KB</span></p>
                </div>
            </div>
        </section>

        <!-- Settings View -->
        <section id="view-settings" class="view-content space-y-8">
            <div class="flex items-center justify-between border-b dark:border-white/5 pb-6">
                <h2 class="text-2xl font-black">لوحة التحكم</h2>
                <div class="flex gap-3">
                    <button onclick="window.lockDashboard()" class="bg-slate-200 dark:bg-white/5 px-4 py-2 rounded-xl font-bold text-sm">خروج</button>
                    <button onclick="window.saveSettings()" class="bg-brand-green text-black px-6 py-2 rounded-xl font-black text-sm">حفظ</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="neon-card p-8 rounded-[2.5rem] space-y-6">
                    <h3 class="font-black text-brand-green flex items-center gap-2"><i data-lucide="fingerprint"></i> التتبع Pixels</h3>
                    <div class="space-y-4">
                        <input type="text" id="fb-pixel" placeholder="Facebook Pixel ID" class="w-full bg-slate-100 dark:bg-black/50 p-4 rounded-xl border-none outline-none font-bold">
                        <input type="text" id="tt-pixel" placeholder="TikTok Pixel ID" class="w-full bg-slate-100 dark:bg-black/50 p-4 rounded-xl border-none outline-none font-bold">
                    </div>
                </div>
                <div class="neon-card p-8 rounded-[2.5rem] space-y-6">
                    <h3 class="font-black text-brand-green flex items-center gap-2"><i data-lucide="lock"></i> الأمان</h3>
                    <div class="space-y-4">
                        <div class="relative">
                            <input type="password" id="setting-admin-pass" placeholder="كلمة سر جديدة" class="w-full bg-slate-100 dark:bg-black/50 p-4 rounded-xl outline-none font-bold">
                            <button onclick="window.togglePasswordVisibility('setting-admin-pass', 'eye-set')" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">
                                <i id="eye-set" data-lucide="eye" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Auth Overlay -->
    <div id="auth-overlay" class="fixed inset-0 z-[100] bg-brand-black/90 backdrop-blur-md items-center justify-center px-6">
        <div class="neon-card p-10 rounded-[3rem] w-full max-w-md text-center space-y-8 border-2 border-brand-green/20">
            <div class="w-20 h-20 bg-brand-green/10 text-brand-green rounded-full flex items-center justify-center mx-auto shadow-2xl">
                <i data-lucide="shield-check" class="w-10 h-10"></i>
            </div>
            <div class="space-y-2">
                <h3 class="text-2xl font-black">دخول المسؤول</h3>
                <p class="text-slate-500 font-bold">أدخل كلمة السر للوصول للإعدادات</p>
            </div>
            <div class="space-y-4">
                <input type="password" id="admin-pass" placeholder="••••" class="w-full bg-slate-100 dark:bg-white/5 p-5 rounded-2xl text-center text-2xl font-black tracking-widest outline-none">
                <div class="flex gap-3">
                    <button onclick="window.closeAuth()" class="flex-1 p-5 rounded-2xl bg-white/5 font-black">إلغاء</button>
                    <button onclick="window.verifyPass()" class="flex-1 bg-brand-green text-black p-5 rounded-2xl font-black">دخول</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-10 left-10 z-[200] transform translate-y-20 opacity-0 transition-all duration-500">
        <div class="bg-brand-green text-black px-10 py-5 rounded-2xl shadow-2xl flex items-center gap-4 font-black">
            <i data-lucide="sparkles" class="w-6 h-6"></i>
            <span id="toast-msg">تمت العملية بنجاح</span>
        </div>
    </div>

</body>
</html>
