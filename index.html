<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>إيليت إيميج | معالجة الصور الاحترافية</title>
    
    <!-- Monetag Ads -->
    <script src="https://otieu.com/4/10428459"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: { 
                        brand: { 
                            primary: '#3b82f6', 
                            success: '#10b981',
                            dark: '#020617',
                            card: '#0f172a'
                        } 
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; transition: background 0.4s; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.08); }
        .dark .glass { background: rgba(15, 23, 42, 0.85); border-bottom: 1px solid rgba(255,255,255,0.08); }
        .upload-zone { border: 2px dashed rgba(59, 130, 246, 0.3); transition: all 0.3s ease; }
        .upload-zone:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
        .hidden { display: none !important; }
        .processing-loader { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .btn-glow { box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
        .share-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .share-btn:hover { transform: translateY(-5px) scale(1.1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-brand-dark dark:text-slate-100 min-h-screen">

    <nav class="fixed top-0 left-0 right-0 z-[100] glass px-6 py-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.reload()">
                <div class="w-10 h-10 bg-brand-primary rounded-xl flex items-center justify-center text-white shadow-xl">
                    <i data-lucide="image" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-black">Elite<span class="text-brand-primary">Image</span></h1>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="window.toggleTheme()" class="w-11 h-11 rounded-xl flex items-center justify-center hover:bg-brand-primary/10 transition-all">
                    <i id="theme-icon" data-lucide="sun" class="w-5 h-5 text-amber-500"></i>
                </button>
            </div>
        </div>
    </nav>

    <main id="main-content" class="pt-28 px-4 max-w-6xl mx-auto pb-20">
        <div id="app-container">
            <!-- Upload View -->
            <section id="upload-view" class="py-12">
                <div class="text-center mb-12">
                    <h2 class="text-4xl md:text-6xl font-black mb-6">حوّل صورك <span class="text-brand-primary">باحترافية</span></h2>
                    <p class="text-slate-500 dark:text-slate-400 max-w-xl mx-auto text-xl font-bold">أداة معالجة الصور الاحترافية، سريعة، مجانية، وبدون إعلانات مزعجة.</p>
                </div>

                <div class="upload-zone rounded-[3rem] p-16 md:p-24 text-center group cursor-pointer bg-white dark:bg-white/5 shadow-2xl border-slate-200 dark:border-white/5" onclick="document.getElementById('file-input').click()">
                    <input type="file" id="file-input" class="hidden" multiple accept="image/*">
                    <div class="w-24 h-24 bg-brand-primary/10 rounded-3xl flex items-center justify-center text-brand-primary mx-auto mb-8 group-hover:scale-110 transition-transform shadow-inner">
                        <i data-lucide="upload-cloud" class="w-12 h-12"></i>
                    </div>
                    <p class="text-3xl font-black mb-3">اسحب الصور هنا أو اضغط للرفع</p>
                    <p class="text-slate-400 font-bold italic">يدعم JPG, PNG, WebP</p>
                </div>
            </section>

            <!-- Workspace View -->
            <section id="workspace-view" class="hidden py-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-8 space-y-6">
                    <div class="bg-white dark:bg-brand-card rounded-[2.5rem] p-6 border border-slate-200 dark:border-white/5 relative overflow-hidden shadow-2xl">
                        <div id="processing-overlay" class="processing-loader rounded-[2.5rem]">
                            <div class="w-14 h-14 border-4 border-brand-primary border-t-transparent rounded-full animate-spin mb-6"></div>
                            <p class="font-black text-white text-xl">جاري المعالجة...</p>
                        </div>
                        <div class="aspect-video relative rounded-2xl overflow-hidden bg-slate-100 dark:bg-brand-dark flex items-center justify-center mb-6">
                            <img id="main-preview" class="max-w-full max-h-full object-contain">
                        </div>
                        
                        <div id="action-area" class="hidden">
                            <button id="download-btn" class="w-full bg-brand-success text-white py-6 rounded-2xl font-black flex items-center justify-center gap-3 hover:scale-[1.02] transition-all shadow-xl text-xl btn-glow mb-8">
                                <i data-lucide="download" class="w-6 h-6"></i>
                                <span>تحميل الصورة المعدلة</span>
                            </button>

                            <!-- Social Share Section -->
                            <div class="border-t border-slate-200 dark:border-white/10 pt-8 text-center">
                                <p class="text-sm font-black text-slate-400 mb-6 uppercase tracking-widest">شارك الموقع مع أصدقائك</p>
                                <div class="flex justify-center gap-4">
                                    <a id="share-wa" href="#" target="_blank" class="share-btn w-14 h-14 bg-[#25D366] text-white rounded-full flex items-center justify-center shadow-lg">
                                        <i data-lucide="message-circle" class="w-7 h-7"></i>
                                    </a>
                                    <a id="share-fb" href="#" target="_blank" class="share-btn w-14 h-14 bg-[#1877F2] text-white rounded-full flex items-center justify-center shadow-lg">
                                        <i data-lucide="facebook" class="w-7 h-7"></i>
                                    </a>
                                    <a id="share-tw" href="#" target="_blank" class="share-btn w-14 h-14 bg-[#000000] text-white rounded-full flex items-center justify-center shadow-lg">
                                        <i data-lucide="twitter" class="w-7 h-7"></i>
                                    </a>
                                    <a id="share-tg" href="#" target="_blank" class="share-btn w-14 h-14 bg-[#0088cc] text-white rounded-full flex items-center justify-center shadow-lg">
                                        <i data-lucide="send" class="w-7 h-7"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="image-queue" class="flex gap-4 overflow-x-auto pb-4"></div>
                </div>

                <div class="lg:col-span-4 space-y-6">
                    <div class="bg-white dark:bg-brand-card rounded-[2.5rem] p-8 border border-slate-200 dark:border-white/5 shadow-2xl">
                        <h3 class="font-black text-xl mb-8 flex items-center gap-3"><i data-lucide="sliders" class="w-6 h-6 text-brand-primary"></i> إعدادات التصدير</h3>
                        <div class="space-y-8">
                            <div>
                                <div class="flex justify-between mb-4 text-sm font-bold"><span>جودة الضغط</span><span id="q-label" class="text-brand-primary">85%</span></div>
                                <input type="range" id="q-slider" min="10" max="100" value="85" class="w-full accent-brand-primary">
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-4">صيغة الملف</label>
                                <select id="f-select" class="w-full bg-slate-50 dark:bg-brand-dark border border-slate-200 dark:border-white/10 rounded-2xl p-5 font-bold outline-none">
                                    <option value="image/webp">WebP (أفضل حجم)</option>
                                    <option value="image/jpeg">JPEG (قياسي)</option>
                                    <option value="image/png">PNG (جودة عالية)</option>
                                </select>
                            </div>
                            <button id="start-process" class="w-full bg-brand-primary text-white py-6 rounded-2xl font-black text-xl shadow-xl hover:scale-[1.02] transition-all">بدء المعالجة</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="py-10 text-center border-t border-slate-200 dark:border-white/5">
        <p class="text-slate-500 text-[12px] font-bold">© 2024 إيليت إيميج. جميع الحقوق محفوظة</p>
    </footer>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[400] transition-all duration-500 translate-y-20 opacity-0 pointer-events-none">
        <div class="bg-white dark:bg-brand-card px-10 py-5 rounded-3xl shadow-2xl border border-brand-primary/30 font-black text-brand-primary text-lg" id="toast-msg"></div>
    </div>

    <script src="index.tsx" type="module"></script>
</body>
</html>
