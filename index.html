<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Elite Image | معالجة الصور والأرباح</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: { 
                        brand: { 
                            primary: '#3b82f6', 
                            success: '#10b981',
                            dark: '#020617',
                            card: '#0f172a'
                        } 
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; transition: background 0.4s; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.08); }
        .dark .glass { background: rgba(15, 23, 42, 0.85); border-bottom: 1px solid rgba(255,255,255,0.08); }
        .upload-zone { border: 2px dashed rgba(59, 130, 246, 0.3); transition: all 0.3s ease; }
        .upload-zone:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
        .ad-slot { border-radius: 1rem; overflow: hidden; background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center; min-height: 100px; }
        .dark .ad-slot { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.05); }
        .hidden { display: none !important; }
        .nav-btn { @apply flex items-center justify-center w-11 h-11 rounded-xl transition-all border border-transparent hover:bg-brand-primary/10 hover:border-brand-primary/20; }
        .processing-loader { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; }
        
        .btn-glow {
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 5px rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.7); }
            100% { box-shadow: 0 0 5px rgba(245, 158, 11, 0.4); }
        }
        .action-appear {
            animation: slide-up 0.4s ease-out forwards;
        }
        @keyframes slide-up {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-brand-dark dark:text-slate-100 min-h-screen">

    <nav class="fixed top-0 left-0 right-0 z-[100] glass px-6 py-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
                <div class="w-10 h-10 bg-brand-primary rounded-xl flex items-center justify-center text-white shadow-xl">
                    <i data-lucide="image" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-black">Elite<span class="text-brand-primary">Image</span></h1>
            </div>
            
            <div class="flex items-center gap-2">
                 <button onclick="window.toggleTheme()" class="nav-btn text-amber-500">
                    <i id="theme-icon" data-lucide="sun" class="w-5 h-5"></i>
                </button>
                <button onclick="window.toggleDashboard()" class="nav-btn text-slate-400">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="pt-28 px-4 max-w-6xl mx-auto pb-20">
        <!-- قسم الرفع -->
        <section id="upload-view" class="py-12">
            <div class="text-center mb-12">
                <h2 class="text-4xl md:text-5xl font-black mb-4">ارفع صورك <span class="text-brand-primary">وضاعف أرباحك</span></h2>
                <p class="text-slate-500 dark:text-slate-400 max-w-xl mx-auto text-lg">حوّل صيغ الصور واضغطها مجاناً وبسرعة فائقة.</p>
            </div>

            <div id="ad-top-banner" class="ad-slot mb-12 max-w-[728px] mx-auto overflow-hidden">
                <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">مساحة إعلانية</span>
            </div>

            <div class="upload-zone rounded-[2.5rem] p-12 md:p-16 text-center group cursor-pointer bg-white dark:bg-white/5 shadow-2xl" onclick="document.getElementById('file-input').click()">
                <input type="file" id="file-input" class="hidden" multiple accept="image/*">
                <div class="w-20 h-20 bg-brand-primary/10 rounded-3xl flex items-center justify-center text-brand-primary mx-auto mb-6 group-hover:scale-110 transition-transform">
                    <i data-lucide="upload-cloud" class="w-10 h-10"></i>
                </div>
                <p class="text-xl font-bold mb-2">اختر الصور لبدء المعالجة</p>
                <p class="text-sm text-slate-500">JPG, PNG, WebP (دقة عالية)</p>
            </div>
        </section>

        <!-- منطقة العمل -->
        <section id="workspace-view" class="hidden py-4 grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-8 space-y-6">
                <div class="bg-white dark:bg-brand-card rounded-[2.5rem] p-4 md:p-6 border border-slate-200 dark:border-white/5 relative overflow-hidden shadow-2xl">
                    <div id="processing-overlay" class="processing-loader rounded-[2.5rem]">
                        <div class="w-12 h-12 border-4 border-brand-primary border-t-transparent rounded-full animate-spin mb-4"></div>
                        <p class="font-black text-white">جاري المعالجة والتحويل...</p>
                    </div>

                    <div class="aspect-video relative rounded-2xl overflow-hidden bg-slate-100 dark:bg-brand-dark flex items-center justify-center mb-6 border border-slate-200 dark:border-white/10">
                        <img id="main-preview" class="max-w-full max-h-full object-contain">
                    </div>
                    
                    <div class="flex flex-col gap-6">
                        <div class="text-right">
                            <h3 id="active-filename" class="font-black text-xl truncate">صورة قيد المعالجة</h3>
                            <p id="active-info" class="text-sm text-slate-500 font-bold mt-1 uppercase">الحجم: 0 KB</p>
                        </div>
                        
                        <!-- أزرار التحميل المصلحة -->
                        <div id="action-area" class="hidden flex flex-col sm:flex-row items-stretch sm:items-center gap-4 w-full action-appear z-10">
                            <a id="adsterra-direct-link" href="#" target="_blank" class="btn-glow bg-amber-500 text-white px-6 py-4 rounded-2xl font-black flex items-center justify-center gap-3 hover:bg-amber-600 transition-all shadow-xl text-lg flex-1">
                                <i data-lucide="zap" class="w-6 h-6 fill-current"></i>
                                <span>تحميل سريع (رابط مباشر)</span>
                            </a>
                            <button id="download-btn" class="bg-brand-success text-white px-6 py-4 rounded-2xl font-black flex items-center justify-center gap-3 hover:scale-105 transition-all shadow-xl shadow-brand-success/20 text-lg flex-1">
                                <i data-lucide="download" class="w-6 h-6"></i>
                                <span>حفظ الصورة النهائية</span>
                            </button>
                        </div>
                    </div>
                </div>
                <div id="image-queue" class="flex gap-4 overflow-x-auto pb-4 no-scrollbar"></div>
            </div>

            <div class="lg:col-span-4 space-y-6">
                <div class="bg-white dark:bg-brand-card rounded-[2.5rem] p-8 border border-slate-200 dark:border-white/5 shadow-2xl">
                    <h3 class="font-black text-xl mb-8 flex items-center gap-2">
                        <i data-lucide="sliders" class="w-5 h-5 text-brand-primary"></i>
                        خيارات المعالجة
                    </h3>
                    <div class="space-y-6">
                        <div>
                            <div class="flex justify-between mb-3 text-sm font-bold">
                                <span>نسبة الضغط</span>
                                <span id="q-label" class="text-brand-primary">85%</span>
                            </div>
                            <input type="range" id="q-slider" min="10" max="100" value="85" class="w-full accent-brand-primary h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-3">تنسيق الصورة</label>
                            <select id="f-select" class="w-full bg-slate-50 dark:bg-brand-dark border border-slate-200 dark:border-white/10 rounded-2xl p-4 font-bold outline-none">
                                <option value="image/webp">WebP (أفضل حجم)</option>
                                <option value="image/jpeg">JPG (متوافق)</option>
                                <option value="image/png">PNG (بدون فقدان)</option>
                            </select>
                        </div>
                        <button id="start-process" class="w-full bg-brand-primary text-white py-5 rounded-2xl font-black text-lg shadow-xl hover:scale-[1.01] transition-all">
                            بدء المعالجة والتحويل
                        </button>
                    </div>
                </div>

                <div id="ad-sidebar-slot" class="ad-slot w-full h-[250px] bg-slate-100 dark:bg-white/5">
                    <span class="text-[10px] text-slate-400 font-bold uppercase">إعلان جانبي</span>
                </div>
            </div>
        </section>
    </main>

    <!-- لوحة التحكم -->
    <div id="admin-panel" class="fixed inset-0 z-[200] bg-black/80 backdrop-blur-md hidden items-center justify-center p-6">
        <div class="bg-white dark:bg-brand-card w-full max-w-2xl rounded-[3rem] p-10 relative shadow-2xl">
            <button onclick="window.toggleDashboard()" class="absolute top-8 left-8 p-2 hover:bg-slate-100 dark:hover:bg-white/10 rounded-full">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <h2 class="text-3xl font-black mb-10 text-right">إدارة روابط Adsterra</h2>
            <div class="space-y-6 text-right">
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-500">رابط Social Bar</label>
                    <input type="text" id="cfg-social" class="w-full bg-slate-50 dark:bg-brand-dark border border-slate-200 dark:border-white/10 rounded-2xl p-4 font-bold outline-none text-left" dir="ltr">
                </div>
                <div class="space-y-2">
                    <label class="font-bold text-sm text-slate-500">رابط Direct Link</label>
                    <input type="text" id="cfg-direct" class="w-full bg-slate-50 dark:bg-brand-dark border border-slate-200 dark:border-white/10 rounded-2xl p-4 font-bold outline-none text-left" dir="ltr">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="font-bold text-sm text-slate-500">Banner ID (728x90)</label>
                        <input type="text" id="cfg-banner-top" class="w-full bg-slate-50 dark:bg-brand-dark border border-slate-200 dark:border-white/10 rounded-2xl p-4 font-bold outline-none text-center" dir="ltr">
                    </div>
                    <div class="space-y-2">
                        <label class="font-bold text-sm text-slate-500">Sidebar ID (300x250)</label>
                        <input type="text" id="cfg-banner-side" class="w-full bg-slate-50 dark:bg-brand-dark border border-slate-200 dark:border-white/10 rounded-2xl p-4 font-bold outline-none text-center" dir="ltr">
                    </div>
                </div>
                <button onclick="window.saveConfig()" class="w-full bg-brand-primary text-white py-5 rounded-2xl font-black text-xl shadow-xl mt-6">تحديث الروابط الآن</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[300] transition-all duration-500 translate-y-20 opacity-0 pointer-events-none text-center">
        <div class="bg-white dark:bg-brand-card px-8 py-4 rounded-2xl shadow-2xl border border-slate-200 dark:border-white/10 font-bold" id="toast-msg"></div>
    </div>

    <script src="index.tsx" type="module"></script>
    <a id="hidden-dl" class="hidden"></a>
</body>
</html>
