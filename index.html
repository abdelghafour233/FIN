<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>StorAI | سحر الذكاء الاصطناعي</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: { 
                        brand: { 
                            primary: '#8b5cf6', // Purple for AI
                            secondary: '#ec4899', // Pink
                            dark: '#0f172a',
                            card: '#1e293b',
                            success: '#22c55e'
                        } 
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; transition: background 0.4s; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .drop-area.active { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.1); transform: scale(1.01); }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-up { animation: slideUp 0.4s ease-out forwards; }
        .gradient-text { background: linear-gradient(to right, #8b5cf6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .magic-border { position: relative; overflow: hidden; }
        .magic-border::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #8b5cf6, #ec4899, transparent); animation: shimmer 2s infinite; }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0"
  }
}
</script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-10">

    <!-- Header -->
    <nav class="sticky top-0 z-50 glass px-6 py-4 mb-8 border-b border-white/5">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.reload()">
                <div class="w-10 h-10 bg-gradient-to-br from-brand-primary to-brand-secondary rounded-xl flex items-center justify-center text-white shadow-lg shadow-brand-primary/20">
                    <i data-lucide="sparkles" class="w-6 h-6"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tight">Stor<span class="gradient-text">AI</span></h1>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="window.toggleTheme()" class="w-10 h-10 rounded-xl flex items-center justify-center bg-white/5 hover:bg-white/10 transition-all">
                    <i id="theme-icon" data-lucide="sun" class="w-5 h-5 text-amber-500"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- App View -->
    <main id="view-app" class="max-w-4xl mx-auto px-6">
        <div class="text-center mb-12 animate-up">
            <h2 class="text-4xl md:text-5xl font-black mb-4 text-white">حول صورك بلمسة <span class="gradient-text">سحرية</span></h2>
            <p class="text-slate-400 font-bold text-lg">ارفع صورتك، صف ما تتخيله، واترك الذكاء الاصطناعي يبدع.</p>
        </div>

        <div id="drop-zone" class="drop-area relative group border-4 border-dashed border-slate-700 hover:border-brand-primary rounded-[3rem] p-12 text-center cursor-pointer transition-all mb-10 animate-up bg-slate-800/30">
            <input type="file" id="file-input" accept="image/*" class="hidden">
            <div class="w-24 h-24 bg-gradient-to-br from-brand-primary/20 to-brand-secondary/20 rounded-full flex items-center justify-center mx-auto mb-6 group-hover:scale-110 transition-transform shadow-inner shadow-white/5">
                <i data-lucide="wand-2" class="w-12 h-12 text-brand-primary"></i>
            </div>
            <h3 class="text-2xl font-black mb-2">اضغط هنا لرفع صورتك</h3>
            <p class="text-slate-500 font-bold text-sm">JPG, PNG, WebP</p>
        </div>

        <section id="editor-section" class="hidden animate-up">
            <div class="glass rounded-[2.5rem] p-8 mb-8 border border-brand-primary/20 shadow-2xl shadow-brand-primary/10 relative">
                
                <div class="mb-6">
                    <label class="block text-lg font-black mb-3 flex items-center gap-2 text-white">
                        <i data-lucide="message-square-dashed" class="text-brand-secondary w-6 h-6"></i> 
                        ماذا تريد أن تفعل بالصورة؟
                    </label>
                    <textarea 
                        id="prompt-input" 
                        class="w-full bg-slate-950/50 border border-white/10 rounded-2xl p-5 text-base text-white placeholder-slate-500 focus:border-brand-primary focus:ring-1 focus:ring-brand-primary outline-none transition-all resize-none h-32"
                        placeholder="مثال: حول الصورة إلى رسم زيتي، اجعل الخلفية في الفضاء، أضف نظارة شمسية، حول النمط إلى سايبر بانك..."
                    ></textarea>
                </div>

                <button id="process-btn" class="magic-border w-full bg-gradient-to-r from-brand-primary to-brand-secondary text-white py-5 rounded-2xl font-black text-xl shadow-xl shadow-brand-primary/20 hover:scale-[1.01] hover:shadow-brand-primary/40 transition-all flex items-center justify-center gap-3">
                    <i data-lucide="stars" class="w-6 h-6"></i> تنفيذ السحر
                </button>
            </div>

            <div id="image-queue" class="space-y-6"></div>
        </section>
    </main>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] transition-all duration-500 translate-y-32 opacity-0">
        <div class="bg-slate-800 border border-brand-primary/50 text-white px-8 py-4 rounded-full shadow-2xl font-bold flex items-center gap-3">
            <i data-lucide="info" class="w-5 h-5 text-brand-primary"></i>
            <span id="toast-msg">تمت العملية بنجاح!</span>
        </div>
    </div>

    <script src="index.js" type="module"></script>
</body>
</html>
