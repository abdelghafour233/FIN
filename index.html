<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Elite Image | معالجة الصور الاحترافية</title>
    
    <!-- Adsterra Popunder -->
    <script type='text/javascript' src='//bouncingbuzz.com/29/98/27/29982794e86cad0441c5d56daad519bd.js'></script>
    
    <!-- Adsterra Social Bar -->
    <script type='text/javascript' src='//bouncingbuzz.com/15/38/5b/15385b7c751e6c7d59d59fb7f34e2934.js'></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: { 
                        brand: { 
                            primary: '#3b82f6', 
                            success: '#10b981',
                            dark: '#020617',
                            card: '#0f172a'
                        } 
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; transition: background 0.4s; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.08); }
        .dark .glass { background: rgba(15, 23, 42, 0.85); border-bottom: 1px solid rgba(255,255,255,0.08); }
        .upload-zone { border: 2px dashed rgba(59, 130, 246, 0.3); transition: all 0.3s ease; }
        .upload-zone:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
        .ad-slot { border-radius: 1rem; overflow: hidden; background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center; min-height: 100px; }
        .dark .ad-slot { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.05); }
        .hidden { display: none !important; }
        .btn-glow { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); animation: pulse-glow 2s infinite; }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 5px rgba(245, 158, 11, 0.4); } 50% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.7); } 100% { box-shadow: 0 0 5px rgba(245, 158, 11, 0.4); } }
        .share-btn { @apply flex items-center justify-center w-12 h-12 rounded-full transition-all hover:scale-110 shadow-lg text-white; }
        .processing-loader { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-brand-dark dark:text-slate-100 min-h-screen">

    <nav class="fixed top-0 left-0 right-0 z-[100] glass px-6 py-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
                <div class="w-10 h-10 bg-brand-primary rounded-xl flex items-center justify-center text-white shadow-xl">
                    <i data-lucide="image" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-black">Elite<span class="text-brand-primary">Image</span></h1>
            </div>
            <button onclick="window.toggleTheme()" class="w-11 h-11 rounded-xl flex items-center justify-center hover:bg-brand-primary/10 transition-all">
                <i id="theme-icon" data-lucide="sun" class="w-5 h-5 text-amber-500"></i>
            </button>
        </div>
    </nav>

    <main class="pt-28 px-4 max-w-6xl mx-auto pb-20">
        <!-- قسم الرفع -->
        <section id="upload-view" class="py-12">
            <div class="text-center mb-12">
                <h2 class="text-4xl md:text-5xl font-black mb-4">أسرع معالج <span class="text-brand-primary">صور احترافي</span></h2>
                <p class="text-slate-500 dark:text-slate-400 max-w-xl mx-auto text-lg font-medium">حوّل، اضغط، وعدل صورك بدقة فائقة وبشكل مجاني تماماً.</p>
            </div>

            <!-- Adsterra 300x250 Top -->
            <div class="flex justify-center mb-12">
                <div id="ad-300x250-top" class="ad-slot min-w-[300px] min-h-[250px]">
                    <script type="text/javascript">
                        atOptions = { 'key' : '0295263cf4ed8d9e3a97b6a2490864ee', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };
                    </script>
                    <script type="text/javascript" src="//bouncingbuzz.com/0295263cf4ed8d9e3a97b6a2490864ee/invoke.js"></script>
                </div>
            </div>

            <div class="upload-zone rounded-[2.5rem] p-12 md:p-20 text-center group cursor-pointer bg-white dark:bg-white/5 shadow-2xl border-slate-200 dark:border-white/5" onclick="document.getElementById('file-input').click()">
                <input type="file" id="file-input" class="hidden" multiple accept="image/*">
                <div class="w-24 h-24 bg-brand-primary/10 rounded-3xl flex items-center justify-center text-brand-primary mx-auto mb-8 group-hover:scale-110 transition-transform">
                    <i data-lucide="upload-cloud" class="w-12 h-12"></i>
                </div>
                <p class="text-2xl font-black mb-3">اسحب الصور أو اضغط هنا للبدء</p>
                <p class="text-slate-500 font-bold uppercase tracking-widest text-sm">WebP, PNG, JPG - جودة عالية 4K</p>
            </div>
        </section>

        <!-- منطقة العمل -->
        <section id="workspace-view" class="hidden py-4 grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-8 space-y-6">
                <div class="bg-white dark:bg-brand-card rounded-[2.5rem] p-6 border border-slate-200 dark:border-white/5 relative overflow-hidden shadow-2xl">
                    <div id="processing-overlay" class="processing-loader rounded-[2.5rem]">
                        <div class="w-14 h-14 border-4 border-brand-primary border-t-transparent rounded-full animate-spin mb-6"></div>
                        <p class="font-black text-white text-xl">جاري المعالجة الذكية...</p>
                    </div>

                    <div class="aspect-video relative rounded-2xl overflow-hidden bg-slate-100 dark:bg-brand-dark flex items-center justify-center mb-6 border border-slate-200 dark:border-white/10">
                        <img id="main-preview" class="max-w-full max-h-full object-contain">
                    </div>
                    
                    <div id="action-area" class="hidden flex flex-col gap-8 w-full">
                        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-4 w-full">
                            <a id="adsterra-direct" href="https://bouncingbuzz.com/29/98/27/29982794e86cad0441c5d56daad519bd.js" target="_blank" class="btn-glow bg-amber-500 text-white px-8 py-5 rounded-2xl font-black flex items-center justify-center gap-3 hover:bg-amber-600 transition-all shadow-xl text-xl flex-1">
                                <i data-lucide="zap" class="w-7 h-7 fill-current"></i>
                                <span>تحميل سريع (عالي الجودة)</span>
                            </a>
                            <button id="download-btn" class="bg-brand-success text-white px-8 py-5 rounded-2xl font-black flex items-center justify-center gap-3 hover:scale-105 transition-all shadow-xl shadow-brand-success/20 text-xl flex-1">
                                <i data-lucide="download" class="w-7 h-7"></i>
                                <span>حفظ الملف النهائي</span>
                            </button>
                        </div>

                        <!-- المشاركة لزيادة الزوار -->
                        <div class="pt-6 border-t border-slate-100 dark:border-white/5 text-center">
                            <p class="text-sm font-bold text-slate-500 mb-6">شارك الخدمة مع أصدقائك:</p>
                            <div class="flex items-center justify-center gap-6">
                                <a id="share-whatsapp" href="#" target="_blank" class="share-btn bg-[#25D366]"><i data-lucide="phone"></i></a>
                                <a id="share-facebook" href="#" target="_blank" class="share-btn bg-[#1877F2]"><i data-lucide="facebook"></i></a>
                                <a id="share-twitter" href="#" target="_blank" class="share-btn bg-[#000000]"><i data-lucide="twitter"></i></a>
                                <a id="share-telegram" href="#" target="_blank" class="share-btn bg-[#0088cc]"><i data-lucide="send"></i></a>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="image-queue" class="flex gap-4 overflow-x-auto pb-4 no-scrollbar"></div>
                
                <!-- Adsterra Native Banner -->
                <div class="mt-12">
                    <script async="async" data-cfasync="false" src="https://bouncingbuzz.com/5391a99b621f7fabc01edf3b98c1b6e5/invoke.js"></script>
                    <div id="container-5391a99b621f7fabc01edf3b98c1b6e5"></div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-white dark:bg-brand-card rounded-[2.5rem] p-8 border border-slate-200 dark:border-white/5 shadow-2xl">
                    <h3 class="font-black text-xl mb-8 flex items-center gap-3">
                        <i data-lucide="sliders" class="w-6 h-6 text-brand-primary"></i>
                        الإعدادات
                    </h3>
                    <div class="space-y-8">
                        <div>
                            <div class="flex justify-between mb-4 text-sm font-bold">
                                <span>نسبة الضغط</span>
                                <span id="q-label" class="text-brand-primary">85%</span>
                            </div>
                            <input type="range" id="q-slider" min="10" max="100" value="85" class="w-full accent-brand-primary h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-4">التنسيق المطلوب</label>
                            <select id="f-select" class="w-full bg-slate-50 dark:bg-brand-dark border border-slate-200 dark:border-white/10 rounded-2xl p-4 font-bold outline-none">
                                <option value="image/webp">WebP (أصغر حجم)</option>
                                <option value="image/jpeg">JPG (أفضل توافق)</option>
                                <option value="image/png">PNG (بدون فقدان)</option>
                            </select>
                        </div>
                        <button id="start-process" class="w-full bg-brand-primary text-white py-5 rounded-2xl font-black text-xl shadow-xl hover:scale-[1.02] active:scale-95 transition-all">
                            معالجة الآن
                        </button>
                    </div>
                </div>

                <!-- Adsterra 160x300 Sidebar -->
                <div class="flex justify-center">
                    <div class="ad-slot min-w-[160px] min-h-[300px]">
                        <script type="text/javascript">
                            atOptions = { 'key' : 'deb441a26b7385b9111cbb19d72d8513', 'format' : 'iframe', 'height' : 300, 'width' : 160, 'params' : {} };
                        </script>
                        <script type="text/javascript" src="//bouncingbuzz.com/deb441a26b7385b9111cbb19d72d8513/invoke.js"></script>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[300] transition-all duration-500 translate-y-20 opacity-0 pointer-events-none text-center">
        <div class="bg-white dark:bg-brand-card px-8 py-4 rounded-2xl shadow-2xl border border-slate-200 dark:border-white/10 font-black text-brand-primary" id="toast-msg"></div>
    </div>

    <script src="index.tsx" type="module"></script>
    <a id="hidden-dl" class="hidden"></a>
</body>
</html>
