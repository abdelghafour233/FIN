<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>إيليت إيميج | معالجة الصور الاحترافية</title>
    
    <!-- Monetag Ads Integration -->
    <script src="https://otieu.com/4/10428864"></script>
    <script src="https://otieu.com/4/10430934"></script>
    <script src="https://otieu.com/4/10428459"></script>
    <script src="https://otieu.com/4/10428641"></script>
    
    <script>
        // تفعيل محرك الإعلانات عند أول تفاعل حقيقي للمستخدم لضمان أعلى نسبة ربح
        document.addEventListener('click', function() {
            console.log('Ad Engine Active');
        }, { once: true });
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: { 
                        brand: { 
                            primary: '#3b82f6', 
                            success: '#10b981',
                            dark: '#020617',
                            card: '#0f172a'
                        } 
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; transition: background 0.4s; overflow-x: hidden; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .upload-zone { border: 2px dashed rgba(59, 130, 246, 0.3); transition: all 0.3s ease; }
        .upload-zone.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .hidden { display: none !important; }
        .neon-shadow { box-shadow: 0 0 20px rgba(59, 130, 246, 0.15); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-brand-dark dark:text-slate-100 min-h-screen">

    <nav class="fixed top-0 left-0 right-0 z-[100] glass px-6 py-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.reload()">
                <div class="w-10 h-10 bg-brand-primary rounded-xl flex items-center justify-center text-white shadow-xl">
                    <i data-lucide="image" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-black">إيليت<span class="text-brand-primary">إيميج</span></h1>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="window.toggleTheme()" class="w-11 h-11 rounded-xl flex items-center justify-center hover:bg-white/5 transition-all">
                    <i id="theme-icon" data-lucide="sun" class="w-5 h-5 text-amber-500"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="pt-28 px-4 max-w-5xl mx-auto pb-20">
        <header class="text-center mb-12">
            <h2 class="text-4xl md:text-5xl font-black mb-4 leading-tight">أداة معالجة الصور <span class="text-brand-primary italic">الاحترافية</span></h2>
            <p class="text-slate-500 dark:text-slate-400 font-bold max-w-2xl mx-auto">
                قم بضغط وتحويل صورك في ثوانٍ معدودة. مجاني بالكامل وبدون حدود.
            </p>
        </header>

        <div id="upload-container">
            <div id="drop-zone" class="upload-zone rounded-[2.5rem] p-16 text-center cursor-pointer bg-white dark:bg-brand-card shadow-2xl transition-all hover:scale-[1.01] neon-shadow">
                <input type="file" id="file-input" class="hidden" multiple accept="image/*">
                <div class="w-24 h-24 bg-brand-primary/10 text-brand-primary rounded-3xl flex items-center justify-center mx-auto mb-8">
                    <i data-lucide="upload-cloud" class="w-12 h-12"></i>
                </div>
                <h3 class="text-3xl font-black mb-4">ارفع صورك الآن</h3>
                <p class="text-slate-400 font-bold">اسحب الملفات هنا أو اضغط للاختيار</p>
            </div>

            <div id="editor-section" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8 mt-12 animate-fade">
                <div class="lg:col-span-2 space-y-4">
                    <div id="image-queue" class="grid grid-cols-1 gap-4">
                        <!-- File cards injected here -->
                    </div>
                </div>

                <div class="lg:col-span-1">
                    <div class="sticky top-28 bg-white dark:bg-brand-card rounded-[2.5rem] p-8 border border-slate-200 dark:border-white/5 shadow-2xl space-y-8">
                        <h3 class="text-xl font-black flex items-center gap-2">
                            <i data-lucide="settings" class="w-6 h-6 text-brand-primary"></i>
                            خيارات المعالجة
                        </h3>
                        
                        <div>
                            <div class="flex justify-between items-center mb-4 font-bold">
                                <span>مستوى الضغط</span>
                                <span id="quality-val" class="text-brand-primary">85%</span>
                            </div>
                            <input type="range" id="quality-slider" min="10" max="100" value="85" class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-brand-primary">
                        </div>

                        <div>
                            <label class="block text-sm font-bold mb-4">تحويل الصيغة إلى</label>
                            <select id="format-select" class="w-full bg-slate-100 dark:bg-brand-dark rounded-xl p-4 font-bold border-none outline-none focus:ring-2 focus:ring-brand-primary">
                                <option value="image/webp">WebP (موصى به)</option>
                                <option value="image/jpeg">JPEG (عالمي)</option>
                                <option value="image/png">PNG (شفاف)</option>
                            </select>
                        </div>

                        <div class="pt-4 space-y-3">
                            <button id="process-all" class="w-full bg-brand-primary text-white py-5 rounded-2xl font-black text-lg shadow-xl hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2">
                                <i data-lucide="zap" class="w-6 h-6"></i>
                                بدء المعالجة
                            </button>
                            <button onclick="window.location.reload()" class="w-full text-slate-500 font-bold py-2 hover:text-red-500 transition-colors">إلغاء العملية</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-12 border-t border-slate-200 dark:border-white/5 text-center text-slate-500 font-bold text-sm">
        <p>© 2024 إيليت إيميج - جميع الحقوق محفوظة</p>
    </footer>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[500] transition-all duration-500 translate-y-20 opacity-0 pointer-events-none">
        <div class="bg-brand-primary text-white px-10 py-4 rounded-2xl shadow-2xl font-black flex items-center gap-3">
            <i data-lucide="check-circle" class="w-6 h-6"></i>
            <span id="toast-msg">تمت العملية بنجاح</span>
        </div>
    </div>

    <script src="index.tsx" type="module"></script>
</body>
</html>
