<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>إيليت إيميج | معالجة الصور الاحترافية</title>
    
    <!-- Monetag Verification -->
    <meta name="monetag" content="a3ee7d0ba0217eccc65608ab9a142c05">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: { 
                        brand: { 
                            primary: '#3b82f6', 
                            success: '#10b981',
                            dark: '#020617',
                            card: '#0f172a'
                        } 
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; transition: background 0.4s; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.08); }
        .dark .glass { background: rgba(15, 23, 42, 0.85); border-bottom: 1px solid rgba(255,255,255,0.08); }
        .upload-zone { border: 2px dashed rgba(59, 130, 246, 0.3); transition: all 0.3s ease; }
        .upload-zone:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
        .hidden { display: none !important; }
        .processing-loader { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .ad-slot { width: 100%; display: flex; align-items: center; justify-content: center; margin: 1.5rem 0; min-height: 50px; }
        .share-btn { @apply w-12 h-12 rounded-2xl flex items-center justify-center text-white transition-all hover:scale-110 shadow-lg active:scale-95; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-brand-dark dark:text-slate-100 min-h-screen">

    <div id="ad-global-container"></div>

    <nav class="fixed top-0 left-0 right-0 z-[100] glass px-6 py-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.reload()">
                <div class="w-10 h-10 bg-brand-primary rounded-xl flex items-center justify-center text-white shadow-xl">
                    <i data-lucide="image" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-black">Elite<span class="text-brand-primary">Image</span></h1>
            </div>
            <button onclick="window.toggleTheme()" class="w-11 h-11 rounded-xl flex items-center justify-center hover:bg-brand-primary/10 transition-all">
                <i id="theme-icon" data-lucide="sun" class="w-5 h-5 text-amber-500"></i>
            </button>
        </div>
    </nav>

    <main id="main-content" class="pt-28 px-4 max-w-6xl mx-auto pb-20">
        <div id="ad-top" class="ad-slot"></div>

        <div id="app-container">
            <!-- Upload View -->
            <section id="upload-view" class="py-12">
                <div class="text-center mb-12">
                    <h2 class="text-4xl md:text-6xl font-black mb-6">حوّل صورك <span class="text-brand-primary">باحترافية</span></h2>
                    <p class="text-slate-500 dark:text-slate-400 max-w-xl mx-auto text-xl">أداة معالجة الصور المتوافقة مع معايير الويب الحديثة.</p>
                </div>

                <div class="upload-zone rounded-[3rem] p-16 md:p-24 text-center group cursor-pointer bg-white dark:bg-white/5 shadow-2xl border-slate-200 dark:border-white/5" onclick="document.getElementById('file-input').click()">
                    <input type="file" id="file-input" class="hidden" multiple accept="image/*">
                    <div class="w-24 h-24 bg-brand-primary/10 rounded-3xl flex items-center justify-center text-brand-primary mx-auto mb-8 group-hover:scale-110 transition-transform">
                        <i data-lucide="upload-cloud" class="w-12 h-12"></i>
                    </div>
                    <p class="text-3xl font-black mb-3">اسحب الصور هنا أو اضغط للرفع</p>
                    <p class="text-slate-500 font-bold uppercase tracking-widest text-sm">أداء سريع وأمان عالٍ</p>
                </div>
            </section>

            <!-- Workspace View -->
            <section id="workspace-view" class="hidden py-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-8 space-y-6">
                    <div class="bg-white dark:bg-brand-card rounded-[2.5rem] p-6 border border-slate-200 dark:border-white/5 relative overflow-hidden shadow-2xl">
                        <div id="processing-overlay" class="processing-loader rounded-[2.5rem]">
                            <div class="w-14 h-14 border-4 border-brand-primary border-t-transparent rounded-full animate-spin mb-6"></div>
                            <p class="font-black text-white text-xl">جاري المعالجة...</p>
                        </div>
                        <div class="aspect-video relative rounded-2xl overflow-hidden bg-slate-100 dark:bg-brand-dark flex items-center justify-center mb-6">
                            <img id="main-preview" class="max-w-full max-h-full object-contain">
                        </div>
                        <div id="action-area" class="hidden flex flex-col items-center">
                            <button id="download-btn" class="bg-brand-success text-white px-8 py-5 rounded-2xl font-black flex items-center justify-center gap-3 hover:scale-[1.02] transition-all shadow-xl text-xl w-full">
                                <i data-lucide="download" class="w-7 h-7"></i>
                                <span>تحميل الصورة المعالجة</span>
                            </button>
                            
                            <!-- قسم المشاركة -->
                            <div class="mt-10 p-6 bg-slate-50 dark:bg-brand-dark/50 rounded-3xl border border-slate-200 dark:border-white/5 w-full text-center">
                                <h4 class="text-sm font-black text-slate-500 mb-6 uppercase tracking-widest flex items-center justify-center gap-2">
                                    <i data-lucide="share-2" class="w-4 h-4"></i> شارك الموقع مع الأصدقاء
                                </h4>
                                <div class="flex flex-wrap justify-center gap-3">
                                    <button onclick="window.share('facebook')" class="share-btn bg-[#1877F2]" title="فيسبوك"><i data-lucide="facebook" class="w-6 h-6"></i></button>
                                    <button onclick="window.share('twitter')" class="share-btn bg-[#000000]" title="X (تويتر)"><i data-lucide="twitter" class="w-6 h-6"></i></button>
                                    <button onclick="window.share('whatsapp')" class="share-btn bg-[#25D366]" title="واتساب"><i data-lucide="message-circle" class="w-6 h-6"></i></button>
                                    <button onclick="window.share('telegram')" class="share-btn bg-[#0088cc]" title="تليجرام"><i data-lucide="send" class="w-6 h-6"></i></button>
                                    <button onclick="window.share('pinterest')" class="share-btn bg-[#E60023]" title="بينتريست"><i data-lucide="pin" class="w-6 h-6"></i></button>
                                    <button onclick="window.share('copy')" class="share-btn bg-brand-primary" title="نسخ الرابط"><i data-lucide="copy" class="w-6 h-6"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="image-queue" class="flex gap-4 overflow-x-auto pb-4 no-scrollbar"></div>
                </div>

                <div class="lg:col-span-4 space-y-6">
                    <div class="bg-white dark:bg-brand-card rounded-[2.5rem] p-8 border border-slate-200 dark:border-white/5 shadow-2xl">
                        <h3 class="font-black text-xl mb-8 flex items-center gap-3"><i data-lucide="sliders" class="w-6 h-6 text-brand-primary"></i> الإعدادات</h3>
                        <div class="space-y-8">
                            <div>
                                <div class="flex justify-between mb-4 text-sm font-bold"><span>جودة الضغط</span><span id="q-label" class="text-brand-primary">85%</span></div>
                                <input type="range" id="q-slider" min="10" max="100" value="85" class="w-full accent-brand-primary h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer">
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-4">تحويل إلى</label>
                                <select id="f-select" class="w-full bg-slate-50 dark:bg-brand-dark border border-slate-200 dark:border-white/10 rounded-2xl p-4 font-bold outline-none">
                                    <option value="image/webp">WebP</option>
                                    <option value="image/jpeg">JPEG</option>
                                    <option value="image/png">PNG</option>
                                </select>
                            </div>
                            <button id="start-process" class="w-full bg-brand-primary text-white py-5 rounded-2xl font-black text-xl shadow-xl hover:scale-[1.02] transition-all">ابدأ المعالجة</button>
                        </div>
                    </div>
                    <div id="ad-sidebar" class="ad-slot"></div>
                </div>
            </section>
        </div>

        <!-- Admin Section -->
        <section id="admin-view" class="hidden py-12">
            <div class="bg-white dark:bg-brand-card rounded-[3rem] p-10 border border-slate-200 dark:border-white/10 shadow-2xl max-w-4xl mx-auto">
                <div class="flex items-center justify-between mb-10">
                    <h2 class="text-3xl font-black flex items-center gap-3"><i data-lucide="shield-check" class="w-8 h-8 text-brand-primary"></i> إعدادات Monetag</h2>
                    <button onclick="window.closeAdmin()" class="text-slate-500 hover:text-brand-primary"><i data-lucide="x-circle" class="w-8 h-8"></i></button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-4 md:col-span-2">
                        <label class="block font-bold text-sm text-brand-primary">Smart Tag</label>
                        <textarea id="ad-smart" class="w-full h-24 bg-slate-50 dark:bg-brand-dark border border-slate-200 dark:border-white/10 rounded-2xl p-4 font-mono text-xs outline-none"></textarea>
                    </div>
                    <div class="space-y-4 md:col-span-2">
                        <label class="block font-bold text-sm">Direct Links</label>
                        <input type="text" id="ad-direct" class="w-full bg-slate-50 dark:bg-brand-dark border border-slate-200 dark:border-white/10 rounded-2xl p-4 font-mono text-sm outline-none">
                    </div>
                    <div class="space-y-4">
                        <label class="block font-bold text-sm">Popunder Tag</label>
                        <textarea id="ad-pop" class="w-full h-32 bg-slate-50 dark:bg-brand-dark border border-slate-200 dark:border-white/10 rounded-2xl p-4 font-mono text-xs outline-none"></textarea>
                    </div>
                    <div class="space-y-4">
                        <label class="block font-bold text-sm">Social / Push Tag</label>
                        <textarea id="ad-social" class="w-full h-32 bg-slate-50 dark:bg-brand-dark border border-slate-200 dark:border-white/10 rounded-2xl p-4 font-mono text-xs outline-none"></textarea>
                    </div>
                </div>
                <button id="save-ads" class="mt-8 w-full bg-brand-primary text-white py-5 rounded-2xl font-black text-xl shadow-xl">حفظ كافة الإعدادات</button>
            </div>
        </section>
        
        <div id="ad-native" class="ad-slot"></div>
    </main>

    <footer class="py-10 text-center opacity-30">
        <button onclick="window.openAdmin()" class="flex items-center gap-2 mx-auto text-xs font-bold text-slate-500 hover:opacity-100 transition-opacity">
            <i data-lucide="lock" class="w-3 h-3"></i> إدارة النظام
        </button>
    </footer>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[300] transition-all duration-500 translate-y-20 opacity-0 pointer-events-none text-center">
        <div class="bg-white dark:bg-brand-card px-8 py-4 rounded-2xl shadow-2xl border border-slate-200 dark:border-white/10 font-black text-brand-primary" id="toast-msg"></div>
    </div>

    <script src="index.tsx" type="module"></script>
    <a id="hidden-dl" class="hidden"></a>
</body>
</html>
