<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>StorImage | معالجة الصور الاحترافية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: { brand: { primary: '#2563eb', success: '#10b981' } }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .light .glass { background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(0, 0, 0, 0.05); }
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* منطقة الإعلانات في الأسفل فقط */
        #bottom-ads-wrapper {
            margin-top: 100px;
            padding: 40px 0;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid rgba(255,255,255,0.05);
            width: 100%;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <!-- Header -->
    <nav class="fixed top-0 left-0 right-0 z-50 glass border-b dark:border-white/5 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.switchView('upload')">
                <div class="w-10 h-10 bg-brand-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                    <i data-lucide="image" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-black italic">Stor<span class="text-brand-primary">Image</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="window.toggleTheme()" class="p-2.5 rounded-xl bg-slate-200 dark:bg-white/5">
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-6 pt-28">
        <section id="view-upload" class="view-section active space-y-8">
            <div class="text-center space-y-3">
                <h2 class="text-4xl font-black">حوّل صورك <span class="text-brand-primary">بذكاء</span></h2>
                <p class="text-slate-500 font-bold">أداة احترافية لتحويل وضغط الصور مجاناً وبسرعة فائقة.</p>
            </div>

            <!-- Tool Settings -->
            <div class="glass p-6 rounded-3xl flex flex-wrap items-center justify-between gap-6">
                <div class="flex flex-wrap items-center gap-6">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-slate-400">الصيغة</label>
                        <select id="export-format" class="block bg-slate-100 dark:bg-slate-800 p-2 rounded-lg outline-none font-bold text-sm">
                            <option value="webp">WebP</option>
                            <option value="png">PNG</option>
                            <option value="jpg">JPG</option>
                        </select>
                    </div>
                    <div class="space-y-1 min-w-[180px]">
                        <label class="text-[10px] font-black uppercase text-slate-400 flex justify-between">الجودة <span id="quality-val" class="text-brand-primary">85%</span></label>
                        <input type="range" id="quality-slider" min="10" max="100" value="85" class="w-full accent-brand-primary cursor-pointer">
                    </div>
                </div>
                <button onclick="window.clearQueue()" class="text-red-500 font-bold text-sm hover:underline">مسح الكل</button>
            </div>

            <!-- Upload Zone -->
            <div id="drop-area" class="glass rounded-[2rem] p-12 text-center cursor-pointer border-2 border-dashed border-brand-primary/30 hover:border-brand-primary transition-all relative">
                <input type="file" id="file-input" multiple accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10">
                <div class="space-y-4">
                    <div class="w-16 h-16 bg-brand-primary/10 text-brand-primary rounded-full flex items-center justify-center mx-auto">
                        <i data-lucide="upload" class="w-8 h-8"></i>
                    </div>
                    <div>
                        <h3 class="text-xl font-black">اسحب الصور هنا</h3>
                        <p class="text-slate-500 text-sm font-bold">أو اضغط لاختيار الملفات من جهازك</p>
                    </div>
                </div>
            </div>

            <!-- File Queue -->
            <div id="file-queue" class="space-y-3"></div>

            <!-- Actions -->
            <div id="action-bar" class="hidden text-center pb-10">
                <button onclick="window.processAll()" id="btn-process-all" class="bg-brand-primary text-white px-10 py-4 rounded-2xl font-black shadow-xl hover:scale-105 transition-all">بدء المعالجة</button>
                <button onclick="window.downloadAll()" id="btn-download-all" class="hidden bg-brand-success text-white px-10 py-4 rounded-2xl font-black shadow-xl hover:scale-105 transition-all">تحميل الجميع</button>
            </div>
        </section>
    </main>

    <!-- Adsterra Area: Bottom ONLY -->
    <footer id="bottom-ads-wrapper">
        <div class="max-w-4xl mx-auto text-center">
            <p class="text-[10px] text-slate-500 font-black mb-6 uppercase tracking-widest">إعلان</p>
            <div id="ad-slot-footer" class="min-h-[100px] inline-block bg-black/10 rounded-xl overflow-hidden">
                <!-- Adsterra Banner Script -->
                <script type="text/javascript">
                    atOptions = {
                        'key' : '15385b7c751e6c7d59d59fb7f34e2934',
                        'format' : 'iframe',
                        'height' : 90,
                        'width' : 728,
                        'params' : {}
                    };
                </script>
                <script type="text/javascript" src="//www.highperformanceformat.com/15385b7c751e6c7d59d59fb7f34e2934/invoke.js"></script>
            </div>
            <p class="mt-10 text-[10px] text-slate-600">StorImage © 2024 - جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] transform translate-y-20 opacity-0 transition-all duration-300">
        <div class="bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl text-sm font-bold flex items-center gap-2">
            <i data-lucide="check-circle" class="w-4 h-4 text-brand-success"></i>
            <span id="toast-msg">تمت العملية</span>
        </div>
    </div>

    <script type="module" src="index.tsx"></script>
</body>
</html>
